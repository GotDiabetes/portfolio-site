<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 0 100 100" role="img" aria-label="Isaac Lee emoji">
  <!-- Isaac as an emoji: wavy black hair falling over the forehead, the
       navy crew-neck from the hero photo, a friendly smile. Drawn by hand
       from the photo; flat shapes with one soft shade each, like the
       system emoji sets. -->
  <defs>
    <radialGradient id="ie-skin" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f6d2b1"/>
      <stop offset="1" stop-color="#e2ab84"/>
    </radialGradient>
    <linearGradient id="ie-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26355a"/>
      <stop offset="1" stop-color="#18223d"/>
    </linearGradient>
    <linearGradient id="ie-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
  </defs>

  <!-- shoulders and shirt -->
  <path d="M12 128c2-22 20-32 52-32s50 10 52 32z" fill="url(#ie-shirt)"/>
  <path d="M46 97c5 8 31 8 36 0" fill="none" stroke="#33446f" stroke-width="3" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M52 80h24v15c0 6-24 6-24 0z" fill="#dba27b"/>

  <!-- ears -->
  <ellipse cx="31" cy="63" rx="6.5" ry="9" fill="#e5ae87"/>
  <ellipse cx="97" cy="63" rx="6.5" ry="9" fill="#e5ae87"/>
  <path d="M30 58c2 2 2 8 0 10M98 58c-2 2-2 8 0 10" fill="none" stroke="#c98c66" stroke-width="1.6" stroke-linecap="round"/>

  <!-- face -->
  <path d="M31 57c0-21 15-31 33-31s33 10 33 31c0 22-13 37-33 37S31 79 31 57z" fill="url(#ie-skin)"/>

  <!-- hair: a wavy, slightly messy mop with volume on top, and a fringe
       that falls over the forehead in uneven pointed strands, swept a
       little to the left as in the photo -->
  <g fill="url(#ie-hair)">
    <path d="M29 63
             C24 51 25 39 32 31
             C29 24 35 17 42 17
             C43 11 50 8 55 10
             C59 5 67 4 71 8
             C76 5 84 7 86 13
             C93 13 99 19 99 27
             C105 35 105 48 99 62
             C98 55 96 50 93 46
             C91 51 89 53 86 55
             C86 50 84 47 80 46
             C78 51 75 53 71 54
             C71 49 69 46 66 46
             C63 51 59 53 55 54
             C56 49 54 46 51 46
             C48 51 44 53 40 53
             C41 48 39 46 36 47
             C33 52 31 57 29 63 Z"/>
    <!-- one loose wave lifting off the crown -->
    <path d="M62 8c2-5 8-6 11-3-3 0-6 1-8 4z"/>
  </g>
  <!-- strands: soft S-curves following the waves, lighter than the hair -->
  <path d="M38 33c4-5 9-3 13-8M54 24c4-5 10-2 14-7M72 25c4-4 9-2 13-6M42 44c3-4 7-3 10-6M62 40c3-4 8-3 11-6M80 40c3-3 7-2 10-5"
        fill="none" stroke="#45454d" stroke-width="1.7" stroke-linecap="round" opacity=".75"/>

  <!-- brows -->
  <path d="M44 53.5c4-2.5 9-3 13-1.5M71 52c4-1.5 9-1 13 1.5" fill="none" stroke="#1d1715" stroke-width="3.2" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="51" cy="62" rx="3.8" ry="3" fill="#231a16"/>
  <ellipse cx="77" cy="62" rx="3.8" ry="3" fill="#231a16"/>
  <circle cx="52.3" cy="61" r="1.1" fill="#fff"/>
  <circle cx="78.3" cy="61" r="1.1" fill="#fff"/>

  <!-- nose -->
  <path d="M64 64c-2 4-3 7 0 8.5" fill="none" stroke="#c98c66" stroke-width="2" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="44" cy="73" rx="5.5" ry="3.2" fill="#ef9a86" opacity=".35"/>
  <ellipse cx="84" cy="73" rx="5.5" ry="3.2" fill="#ef9a86" opacity=".35"/>

  <!-- smile -->
  <path d="M54.5 79c5 6 14 6 19 0-6 2.2-13 2.2-19 0z" fill="#8f3d33" stroke="#8f3d33" stroke-width="2" stroke-linejoin="round"/>
  <path d="M57 80.2c4 1.4 10 1.4 14 0l-1 1.6c-4 1-8 1-12 0z" fill="#fff"/>
</svg>
