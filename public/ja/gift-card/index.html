  <div class="print-bar">
    <h1>ギフトカードを作る</h1>
    <p>わかる項目だけ入力してください。空欄は手書き用の線として印刷されます。レターサイズの用紙かカード用紙に100%で印刷し、点線に沿って切ってください。</p>
    <form class="card-form" id="cardForm">
      <label>
        <span class="field-label">ギフト</span>
        <select name="gift">
          <option>個人レッスン1回</option>
          <option>個人レッスン5回</option>
          <option>個人レッスン10回</option>
          <option>ヒッティングセッション1回</option>
        </select>
      </label>
      <label>
        <span class="field-label">贈る相手 <span class="field-optional">任意</span></span>
        <input type="text" name="to" maxlength="40" autocomplete="off" />
      </label>
      <label>
        <span class="field-label">贈り主 <span class="field-optional">任意</span></span>
        <input type="text" name="from" maxlength="40" autocomplete="off" />
      </label>
      <label>
        <span class="field-label">メッセージ <span class="field-optional">任意</span></span>
        <input type="text" name="message" maxlength="140" autocomplete="off" />
      </label>
      <label>
        <span class="field-label">カード番号 <span class="field-optional">任意</span></span>
        <input type="text" name="number" maxlength="12" autocomplete="off" />
      </label>
    </form>
    <div class="print-row">
      <button class="print-btn" type="button" data-print hidden>カードを印刷</button>
      <a class="print-home" href="/ja/">サイトに戻る</a>
    </div>
    <nav class="print-langs" aria-label="ほかの言語のカード">
      <a href="/gift-card/" hreflang="en" lang="en">English</a>
      <a href="/es/gift-card/" hreflang="es" lang="es">Español</a>
      <a href="/ko/gift-card/" hreflang="ko" lang="ko">한국어</a>
      <a href="/zh-hans/gift-card/" hreflang="zh-Hans" lang="zh-Hans">简体中文</a>
      <a href="/zh-hant/gift-card/" hreflang="zh-Hant" lang="zh-Hant">繁體中文</a>
      <a href="/ja/gift-card/" hreflang="ja" lang="ja" aria-current="page">日本語</a>
      <a href="/vi/gift-card/" hreflang="vi" lang="vi">Tiếng Việt</a>
      <a href="/fa/gift-card/" hreflang="fa" lang="fa">فارسی</a>
    </nav>
  </div>

  <div class="sheet-scroll">
    <main class="sheet card-sheet">
      <article class="gift-card">
        <div class="gc-head">
          <img class="gc-logo" src="/images/lee-tennis-logo.svg?v=lt-restored-1" width="336" height="112" alt="Lee Tennis Co. — LT モノグラム" />
          <div class="gc-meta">
            <p class="eyebrow">ギフトカード</p>
            <p class="gc-number"><span>番号</span> <span data-card="number"></span></p>
          </div>
        </div>

        <div class="gc-body">
          <p class="gc-label">贈る相手</p>
          <p class="gc-to" data-card="to"></p>
          <p class="gc-gift" data-card="gift">個人レッスン1回</p>
          <p><span class="gc-message" data-card="message" data-card-row></span></p>
          <p class="gc-from"><span class="gc-label">贈り主</span> <span data-card="from"></span></p>
        </div>

        <div class="gc-foot">
          <div>
            <p class="gc-book">予約は、コードをスキャンするか leetennisco.com から。その際にこのカードのことをお伝えください。</p>
            <p class="gc-coach">Isaac Lee · RSPA 認定コーチ · アーバイン Toscana コート</p>
          </div>
          <div class="qr" data-qr="" role="img" aria-label="レッスンのページを開くQRコード"></div>
        </div>
      </article>
    </main>
  </div>
