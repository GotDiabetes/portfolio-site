# Cloudflare Worker behind the tennis page's lesson matcher and Ask Isaac
# chat. Deploy steps are in the repo README ("Jev features").
name = "lee-tennis-jev"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# Only the one workers.dev address; no extra per-version preview URLs.
preview_urls = false

# 6 matches a minute per visitor.
[[ratelimits]]
name = "PER_VISITOR"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 6
  period = 60

# 60 a minute across the whole site.
[[ratelimits]]
name = "SITE_WIDE"
namespace_id = "2002"

  [ratelimits.simple]
  limit = 60
  period = 60

# Page events (a Book press, a form sent): 30 a minute per visitor.
[[ratelimits]]
name = "HITS"
namespace_id = "2003"

  [ratelimits.simple]
  limit = 30
  period = 60

# Isaac's numbers: daily counts and the chat's unanswered questions (see
# README). Wrangler creates the database on the first deploy that has this
# block; the Worker makes its own tables on first use.
[[d1_databases]]
binding = "DB"
database_name = "lee-tennis-stats"
